# Luigi's Mansion (USA): the selected AutoHDR post shader outputs black in the
# tested D3D11 HDR path. Use Dolphin's default output shader; HDR remains enabled.
[Core]
GFXBackend = D3D

[Video_Stereoscopy]
# Dolphin renders the two views; VisionGameHook converts the packed image.
StereoMode = 1
StereoPerEyeResolutionFull = True
StereoSwapEyes = False

[Video_Hardware]
VSync = True

[Video_Enhancements]
PostProcessingShader =
