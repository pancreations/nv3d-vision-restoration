[Stereo]
; Camera separation in game world units. Start small.
EyeSeparation=0.065
; Uniform image translation per eye, as a fraction of the full eye width.
; Positive values bring the zero-parallax plane closer. No depth warping.
ConvergenceShift=0.0025
SwapEyes=0
; Calibrated from near/far parallax in the inspected Elden Ring 2.7.1.0 build.
; Source order is corrected before convergence is applied.
ReverseCameraOrder=1
; Keep the central camera pose identical for the two views in a pair.
; World animation still advances between the two renders.
LockPairPose=1
